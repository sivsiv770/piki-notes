<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>פיקי והתווים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: a surf-green electric guitar. Pearl pickguard holds the home panel, the level map is a real neck
   running from headstock to sound hole, the game is a sheet of staff paper above picks or a fretboard. */
:root{
  --bg:#9ADBCB; --bg-2:#6FC7B5; --panel:#FFF9EA; --fg:#14302D; --muted:#3F5F5A; --line:#14302D;
  --wood:#3B2116; --wood-2:#54301F; --wood-fg:#FFF3DC; --fret:#D5DADB; --string:#EFE6CF; --pearl:#FFF4D9;
  --pick:#FFB400; --pick-2:#FF8A1F; --on-pick:#2B1A0B;
  --paper:#FFFBEF; --paper-ink:#1B2433; --zone:#FFD86B;
  --good:#0B7A48; --bad:#B3261E; --star:#F5A400; --star-off:#B7C9C4;
  --doubt:#B3261E; --n-C:#FF7B72; --n-D:#FFA94D; --n-E:#FFE14D; --n-F:#7BDC85; --n-G:#5FD8EA; --n-A:#BCA6FF; --n-B:#FF9FD8; --n-ink:#1B2433;
  --display:"Suez One","Fredoka",Georgia,serif;
  --body:"Fredoka","Varela Round","Arial Rounded MT Bold",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F2F33; --bg-2:#174148; --panel:#1C4A4F; --fg:#EAF8F3; --muted:#B4D4CD; --line:#EAF8F3;
  --good:#5BE0A0; --bad:#FF9A90; --star:#FFC233; --star-off:#55767A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F2F33; --bg-2:#174148; --panel:#1C4A4F; --fg:#EAF8F3; --muted:#B4D4CD; --line:#EAF8F3;
  --good:#5BE0A0; --bad:#FF9A90; --star:#FFC233; --star-off:#55767A; color-scheme:dark;
}
:root[data-contrast="high"]{
  --bg:#FFFFFF; --bg-2:#FFFFFF; --panel:#FFFFFF; --fg:#000000; --muted:#000000; --line:#000000;
  --wood:#000000; --wood-2:#000000; --wood-fg:#FFFFFF; --fret:#FFFFFF; --string:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#000000; --zone:#FFE680; --good:#005C2E; --bad:#8E0000; --star:#8A5A00; --star-off:#777777; color-scheme:light;
}
:root[data-large="1"]{font-size:118%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
h1:focus,h1:focus-visible{outline:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--pick-2);outline-offset:2px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.page{max-width:1120px;margin-inline:auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:56px;padding:.5em 1.3em;border-radius:16px;border:3px solid var(--line);background:var(--panel);font-weight:600;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--pick);color:var(--on-pick);border-color:var(--on-pick);box-shadow:0 5px 0 var(--on-pick);font-size:1.25rem;min-height:64px}
.btn.small{min-height:46px;padding:.25em .9em;font-size:1rem;box-shadow:0 3px 0 var(--line)}
.seg{display:flex;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.seg button{flex:1 1 0;min-height:52px;padding:.25em .4em;border:0;background:transparent;font-weight:600;min-width:0}
.seg button+button{border-inline-start:3px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--pick);color:var(--on-pick)}
.lab{font-weight:600;font-size:.95rem;color:var(--muted);display:block;margin-bottom:.3rem}
.back{margin-bottom:16px}
.stars{display:inline-flex;gap:2px;vertical-align:middle;direction:ltr}
.stars svg{width:1.1em;height:1.1em}
.st-on{fill:var(--star);stroke:var(--on-pick);stroke-width:1.5}
.st-off{fill:none;stroke:var(--star-off);stroke-width:2}
.wood .st-off{stroke:#B59A84}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.head-row h1{font-size:clamp(1.9rem,6vw,2.8rem)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr)}}
.guard{background:var(--panel);border:3px solid var(--line);border-radius:36px 120px 36px 90px;padding:26px 24px 28px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (max-width:820px){.guard{position:static;border-radius:30px 70px 30px 60px}}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:clamp(2.2rem,7vw,3.3rem)}
.brand svg{width:88px;height:88px;flex:none}
.tag{font-size:1.15rem}
.peek{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);border-radius:16px;padding:6px 12px 6px 6px;width:100%;text-align:start}
.peek svg{width:100%;height:96px;display:block}
.peek b{display:block;font-size:1.25rem}
.peek small{font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 auto}
.totals{display:flex;gap:18px;font-weight:600;flex-wrap:wrap}
.totals span b{font-family:var(--display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums;margin-inline-end:.25em}

/* neck map */
.neckmap{position:relative;max-width:560px;margin-inline:auto;width:100%}
.headstock{height:112px;background:var(--wood-2);clip-path:polygon(16% 0,84% 0,92% 100%,8% 100%);position:relative;display:flex;align-items:center;justify-content:center;color:var(--wood-fg)}
.headstock h2{font-size:1.45rem}
.peg{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--fret);border:2px solid #000}
.nut{height:12px;background:var(--pearl);border-block:2px solid #000}
.board{background:linear-gradient(90deg,var(--wood) 0,var(--wood-2) 50%,var(--wood) 100%);position:relative}
.board::before{content:"";position:absolute;inset:0 6%;pointer-events:none;background-image:repeating-linear-gradient(90deg,var(--string) 0 2px,transparent 2px 20%);opacity:.28}
.lvl{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:92px;padding:10px 16px;background:transparent;border:0;border-bottom:6px solid var(--fret);color:var(--wood-fg);text-align:start;box-shadow:inset 0 -2px 0 #0006}
.lvl:hover:not(.locked){background:#ffffff14}
.lvl .dot{width:58px;height:58px;border-radius:50%;background:var(--pearl);color:#2B1A0B;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;border:3px solid #000}
.lvl.here .dot{background:var(--pick)}
.lvl.locked .dot{background:#8D7767}
.lvl b{display:block;font-size:1.18rem;font-weight:600;line-height:1.2}
.lvl small{font-size:.98rem;display:block;overflow-wrap:anywhere}
.soundhole{height:150px;background:radial-gradient(circle at 50% -10%,#000 0 74px,var(--pearl) 75px 80px,var(--wood) 81px 86px,var(--pearl) 87px 92px,transparent 93px),radial-gradient(circle at 50% 0,var(--pick) 0 40%,var(--pick-2) 62%,var(--wood-2) 100%);border-radius:0 0 40% 40%}

/* level page */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ncard{background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:4px;text-align:center;align-items:stretch}
.ncard .stf{height:112px;width:100%;display:block}
.ncard b{font-size:1.18rem;line-height:1.2}
.ncard small{font-size:.9rem;line-height:1.25}
.ncard .mn{width:100%;height:50px;display:block}
.sec{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:1.45rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border:3px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 5px 0 var(--line);text-align:start;min-height:112px}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode b{font-family:var(--display);font-weight:400;font-size:1.4rem}
.note-text{font-size:.98rem;max-width:62ch}

/* play */
#play{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;background:var(--bg);padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:5}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;flex:none}
.pikibox{display:flex;align-items:center;gap:6px;min-width:0}
.pikibox svg{width:52px;height:52px;flex:none}
.bubble{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:.15em .7em;font-weight:600;line-height:1.25;min-height:2.1em;display:flex;align-items:center;font-size:clamp(.95rem,2.6vw,1.1rem);min-width:0}
.score{text-align:center;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem}
.progress{flex:none;height:12px;background:var(--wood);border-radius:6px;overflow:hidden;direction:ltr}
.progress i{display:block;height:100%;width:0;background:var(--pick);transition:width .25s}
.playmain{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{flex:1;min-height:120px;background:var(--paper);border:3px solid var(--line);border-radius:18px;overflow:hidden;direction:ltr}
.stage svg{display:block;width:100%;height:100%}
.answers{flex:none;display:flex;flex-direction:column;gap:8px}
@media (orientation:landscape) and (max-height:540px){
  .playmain{flex-direction:row}
  .stage{flex:1 1 50%}
  .answers{flex:1 1 50%;justify-content:center;overflow:auto;min-width:0}
}
.picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pickbtn{flex:1 1 calc(25% - 8px);max-width:190px;min-height:76px;background:var(--c);color:var(--n-ink);border:3px solid var(--n-ink);border-radius:18px 18px 46% 46%;font-weight:700;font-size:1.5rem;line-height:1.05;padding:.2em .2em .45em;box-shadow:0 4px 0 var(--n-ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pickbtn small{font-size:1.02rem;font-weight:600}
.pickbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--n-ink)}
.pickbtn.sm{font-size:1.15rem}
.pickbtn.hint{animation:glow .7s ease-in-out infinite alternate;outline:4px solid var(--fg);outline-offset:2px}
.pickbtn.no{opacity:.45;text-decoration:line-through}
kbd{position:absolute;top:3px;inset-inline-start:7px;font:600 .72rem var(--body);opacity:.7}
@media (hover:none){kbd{display:none}}
.fb{direction:ltr;display:grid;background:var(--wood);border-radius:10px;overflow:hidden;color:var(--wood-fg);border:3px solid var(--line)}
.fb .cell{position:relative;border:0;background:transparent;padding:0;min-height:clamp(34px,6.1vh,50px);border-right:4px solid var(--fret);min-width:0}
.fb .cell.open{border-right:9px solid var(--pearl);background:#00000033}
.fb.lefty .cell{border-right:0;border-left:4px solid var(--fret)}
.fb.lefty .cell.open{border-right:0;border-left:9px solid var(--pearl)}
.fb .cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--sw,2px);margin-top:calc(var(--sw,2px) / -2);background:var(--string)}
.fb .cell::after{content:attr(data-m);position:absolute;left:50%;top:50%;width:min(1.75em,86%);aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:var(--pick);color:var(--on-pick);display:grid;place-items:center;font-weight:700;font-size:1rem;line-height:1;transition:transform .08s}
.fb .cell:hover::after{transform:translate(-50%,-50%) scale(.62)}
.fb .cell:focus-visible{outline-offset:-4px}
.fb .cell:focus-visible::after{transform:translate(-50%,-50%) scale(.75)}
.fb .cell.ok::after{transform:translate(-50%,-50%) scale(1);background:var(--n-F);color:#000}
.fb .cell.no::after{transform:translate(-50%,-50%) scale(1);background:#FF9A90;color:#000}
.fb .cell.hint::after{transform:translate(-50%,-50%) scale(1);animation:glow .7s ease-in-out infinite alternate}
.fb .sl,.fb .fn{display:grid;place-items:center;font-size:.86rem;font-weight:600;min-height:22px;background:#0003}
.fb .fn.inlay{color:var(--pick)}
.micbox{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.micbox .big{font-family:var(--display);font-size:1.3rem}
.meter{height:14px;background:var(--bg-2);border-radius:7px;overflow:hidden;direction:ltr;border:2px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--good)}
.reveal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.reveal svg{height:70px;width:100%}
.nt .pop{animation:pop .42s ease-out forwards;transform-box:fill-box;transform-origin:center}
.nt .shake{animation:shake .32s ease-in-out}
@keyframes pop{to{transform:translateY(-40px) scale(1.25);opacity:0}}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
:root[data-still="1"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* results */
.res{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.res svg.pk{width:128px;height:128px}
.res h1{font-size:clamp(2rem,7vw,3rem)}
.res .stars svg{width:68px;height:68px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.facts div{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:8px 4px;font-size:.95rem;line-height:1.2}
.facts b{display:block;font-family:var(--display);font-weight:400;font-size:1.65rem;font-variant-numeric:tabular-nums}
.weak{width:100%}

/* turn music into notes */
.tagx{border:3px solid var(--line);border-radius:999px;padding:.05em .7em;font-weight:600;background:var(--pick);color:var(--on-pick)}
.trgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.trbox{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trbox h2{font-size:1.4rem}
.trtime{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.trerr{border:3px solid var(--bad);border-radius:14px;padding:.5em .8em;font-weight:600;background:var(--panel);color:var(--fg)}
.trw{margin:0;padding-inline-start:1.2em;font-weight:600}
.trscroll{overflow-x:auto;background:var(--paper);border:3px solid var(--line);border-radius:14px;direction:ltr;max-width:100%}
.trscroll svg{display:block;max-width:none}
.trtable{overflow-x:auto;max-width:100%}
.trtable table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.trtable th,.trtable td{padding:.35em .6em;text-align:start;border-bottom:2px solid var(--bg-2);white-space:nowrap}
.linkb{background:none;border:0;padding:.2em .1em;font-weight:600;text-decoration:underline;min-height:36px}
.trbox textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:3px solid var(--line);border-radius:12px;padding:.5em .7em;min-width:0}
.trlib{display:flex;flex-direction:column;gap:8px}
.trrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trrow .grow{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.trrow small{display:block}
.trpre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;max-height:220px;overflow:auto;direction:ltr;text-align:left}
label.btn{cursor:pointer}
.trbox h3{font-size:1.2rem}
.trbox.inner{padding:10px 12px;background:var(--bg);border-width:2px}
.kitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mgrid div{border:2px solid var(--line);border-radius:12px;padding:6px 8px;line-height:1.2;font-size:.92rem;background:var(--panel)}
.mgrid b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.trtable td.wrap{white-space:normal;overflow-wrap:anywhere}
.trtable th[scope=row]{font-weight:600;white-space:normal;min-width:10em}
.trtable tr.st-sub td,.trtable tr.st-del td,.trtable tr.st-ins td{background:var(--bg-2)}
.seglab{display:inline-flex;align-items:center;gap:.5em;font-weight:600}
.seglab select{font:inherit;min-height:46px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0 .5em}
a.btn{text-decoration:none;color:var(--on-pick)}
summary{cursor:pointer;min-height:36px}
.edglobal{display:flex;flex-wrap:wrap;gap:10px 18px}
.edglobal input{font:inherit;width:5.5em;min-height:46px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0 .4em}
.edsheet{background:var(--paper);outline-offset:3px}
.edsheet svg{cursor:pointer}
.edpanel{display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--bg-2);padding-top:10px}
.edsel{font-size:1.05rem}
.edrow{display:flex;flex-direction:column;gap:4px}
.edbtns{display:flex;flex-wrap:wrap;gap:6px}
.edbtns .btn.small{min-height:44px;padding:.15em .7em}
.lsteps{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px}
.lsteps span{border:2px solid var(--line);border-radius:999px;padding:.1em .7em;font-weight:600;font-size:.95rem;background:var(--panel)}
.lsteps span.on{background:var(--pick);color:var(--on-pick);border-color:var(--on-pick)}
.lsteps span.past{opacity:.6}
.lpiki{display:flex;align-items:center;gap:10px;margin-block:8px}
.lpiki svg{width:64px;height:64px;flex:none}
.lshow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:center}
@media (max-width:560px){.lshow{grid-template-columns:minmax(0,1fr)}}
.lnote{font-family:var(--display);font-weight:400;font-size:2.2rem;display:block}
.lneck{width:100%;max-width:420px;height:auto}
.lheard{font-weight:600;min-height:1.6em}
.edbtns .btn[aria-pressed="true"]{background:var(--pick);color:var(--on-pick);border-color:var(--on-pick)}

/* settings and tuner */
.opts{display:flex;flex-direction:column;gap:10px;max-width:640px}
.opt{display:flex;align-items:center;gap:12px;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:10px 14px;min-height:60px;cursor:pointer}
.opt input[type=checkbox]{width:28px;height:28px;accent-color:var(--pick-2);flex:none}
.opt input[type=range]{flex:1;min-width:0;accent-color:var(--pick-2);height:32px}
.opt div{min-width:0}
.opt small{display:block;color:var(--muted);line-height:1.3}
.strings{display:flex;flex-direction:column;gap:10px;max-width:640px}
.strbtn{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:64px;padding:6px 14px;border:3px solid var(--line);border-radius:14px;background:var(--wood);color:var(--wood-fg);text-align:start;position:relative;font-weight:600}
.strbtn.lit{outline:4px solid var(--pick)}
.needle{height:58px;position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;overflow:hidden;max-width:640px}

/* ---------- guitar sound: Karplus-Strong plucked string ---------- */
let ctx=null,master=null,bus=null;
function pluckSamples(freq,sr,sec){
  sec=sec||2.6;
  const S=freq<220?.5:freq>700?.14:.5-(freq-220)/480*.36;
  const N=Math.max(2,Math.floor(sr/freq+S-1)),len=Math.floor(sr*sec),out=new Float32Array(len),line=new Float32Array(N+1);
  let lp=0;const bright=Math.min(.82,.38+freq/1300);
  for(let i=0;i<=N;i++){lp+=bright*((Math.random()*2-1)-lp);line[i]=lp}
  const pick=Math.max(1,Math.round(N*.17)),copy=line.slice();
  for(let i=0;i<=N;i++)line[i]=copy[i]-.9*copy[(i-pick+N+1)%(N+1)];
  const rho=Math.min(.9994,.9992+(freq<200?.0002:0))-(freq>500?(freq-500)*.0000012:0);
  let p=0,peak=0;
  for(let i=0;i<len;i++){
    const a=line[p],b=line[(p+1)%(N+1)],v=rho*((1-S)*a+S*b);
    out[i]=a;line[p]=v;p=(p+1)%(N+1);
    const q=Math.abs(a);if(q>peak)peak=q;
  }
  const norm=.85/(peak||1),fade=Math.floor(sr*.25);
  for(let i=0;i<len;i++){out[i]*=norm;if(i>len-fade)out[i]*=(len-i)/fade}
  return{data:out,rate:freq*(N+1-S)/sr};
}
function audio(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;

    bus=ctx.createGain();
    const b1=ctx.createBiquadFilter();b1.type="peaking";b1.frequency.value=105;b1.Q.value=1.1;b1.gain.value=5;
    const b2=ctx.createBiquadFilter();b2.type="peaking";b2.frequency.value=230;b2.Q.value=1.3;b2.gain.value=3;
    const b3=ctx.createBiquadFilter();b3.type="highshelf";b3.frequency.value=3200;b3.gain.value=-5;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;
    const irLen=Math.floor(ctx.sampleRate*.7),ir=ctx.createBuffer(2,irLen,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,3.2)}
    const rev=ctx.createConvolver();rev.buffer=ir;const wet=ctx.createGain();wet.gain.value=.1;
    bus.connect(b1);b1.connect(b2);b2.connect(b3);b3.connect(comp);comp.connect(master);
    b3.connect(rev);rev.connect(wet);wet.connect(master);master.connect(ctx.destination);
  }
  if(ctx.state!=="running")ctx.resume();

}

const CACHE={};
function bufFor(midi){
  if(CACHE[midi])return CACHE[midi];
  const f=440*Math.pow(2,(midi-69)/12),p=pluckSamples(f,ctx.sampleRate),b=ctx.createBuffer(1,p.data.length,ctx.sampleRate);
  b.copyToChannel(p.data,0);return CACHE[midi]={b,rate:p.rate};
}
/* midi here is the SOUNDING pitch */
function pluck(midi,delay,vel){
  if(!audio())return;
  const c=bufFor(midi),s=ctx.createBufferSource(),g=ctx.createGain();
  s.buffer=c.b;s.playbackRate.value=c.rate;g.gain.value=vel||.9;
  s.connect(g);g.connect(bus);s.start(ctx.currentTime+(delay||0));
}

  if(!audio())return;

  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4)+Math.sin(i/ctx.sampleRate*2*Math.PI*92)*Math.pow(1-i/len,3);

}

/* ---------- microphone pitch detection (YIN) ---------- */
function yin(buf,sr,minF,maxF){
  const tMax=Math.min(Math.floor(sr/(minF||70)),Math.floor(buf.length/2)),tMin=Math.floor(sr/(maxF||1500)),W=buf.length-tMax;
  const d=new Float32Array(tMax+1);
  for(let t=1;t<=tMax;t++){let s=0;for(let i=0;i<W;i+=2){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  let run=0,best=-1;
  for(let t=1;t<=tMax;t++){run+=d[t];d[t]=run>0?d[t]*t/run:1}
  for(let t=Math.max(2,tMin);t<tMax;t++){
    if(d[t]<.14){while(t+1<tMax&&d[t+1]<d[t])t++;best=t;break}
  }
  if(best<0)return null;
  const a=d[best-1],b=d[best],c=d[best+1]??b,den=a-2*b+c,sh=den?(a-c)/(2*den):0;
  return sr/(best+sh);
}
const Mic={stream:null,an:null,buf:null,timer:0,
  async start(onPitch){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("none");
    this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audio();
    const src=ctx.createMediaStreamSource(this.stream);
    this.an=ctx.createAnalyser();this.an.fftSize=4096;src.connect(this.an);this.sink=keepAlive(this.an);this.buf=new Float32Array(this.an.fftSize);this.src=src;
    this.timer=setInterval(()=>{
      this.an.getFloatTimeDomainData(this.buf);
      let r=0;for(let i=0;i<this.buf.length;i+=4)r+=this.buf[i]*this.buf[i];r=Math.sqrt(r/(this.buf.length/4));
      const f=r>.006?yin(this.buf,ctx.sampleRate,72,1400):null;
      onPitch(f,r);
    },70);
  },
  stop(){clearInterval(this.timer);this.timer=0;if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;if(this.src)this.src.disconnect();this.src=null;if(this.sink){this.sink.disconnect();this.sink=null}}

function clefSVG(x){const k=.132;return`<path transform="translate(${x} 0) scale(${k} ${-k})" d="${GLYPH.clef.d}" fill="var(--paper-ink)"/>`}
function noteSVG(n,o){

  for(let st=10;st<=n.step;st+=2)s+=`<line x1="-31" x2="31" y1="${-st*S}" y2="${-st*S}" stroke="${ink}" stroke-width="3"/>`;
  const up=n.step<4,len=Math.max(7,Math.abs(n.step-4))*S;

function stepRange(notes){

let G=null;

function weight(n){
  const s=DB.stats[n.key];if(!s)return 2.5;
  return 1+3*(s.e+1)/(s.a+2)+(s.t>4?1:0);
}
function buildSeq(notes,total){
  const seq=[],pool=[...notes];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  seq.push(...pool);
  while(seq.length<total){
    const last=seq[seq.length-1],opts=notes.filter(n=>n!==last||notes.length===1),sum=opts.reduce((a,n)=>a+weight(n),0);
    let r=Math.random()*sum,p=opts[0];
    for(const n of opts){r-=weight(n);if(r<=0){p=n;break}}
    seq.push(p);
  }
  return seq.slice(0,Math.max(total,notes.length));
}
function startGame(lid,mode){

  G={l,lid,mode,speed,seq:buildSeq(l.notes,total),i:0,q:[],pts:0,combo:0,best:0,first:0,times:[],miss:{},wrongNow:0,over:false,prev:null,t0:performance.now(),last:performance.now(),self:false,micOn:false};

function tick(now){

function parseExpected(t){

  for(let i=0;i<toks.length;i++){

    const he=k.match(/^(דו|רה|מי|פה|סול|לה|סי)([#♯b♭]?)(\d?)$/),en=k.match(/^([A-Ga-g])([#♯b♭]?)(\d?)$/);

    L=he?HEB[m[1]]:m[1].toUpperCase();
    if(/[#♯]/.test(m[2]))acc=1;if(/[b♭]/.test(m[2]))acc=-1;
    if(m[3])oct=+m[3];

    const pc=(SEMI[L]+acc+12)%12;

  }
  return{out,bad};
}

/* ---------- score editor: staff and tablature stacked, one data model ---------- */
/* A score item: {midi, beats, s, f, lock} for a note, {rest:true, beats} for a rest. midi is the SOUNDING pitch. */
const Ed=(()=>{
  const TUNING={1:64,2:59,3:55,4:50,5:45,6:40},MAXF=17,LOW=40,HIGH=88;
  const DURS=[[4,"שלם"],[3,"חצי מנוקד"],[2,"חצי"],[1.5,"רבע מנוקד"],[1,"רבע"],[.75,"שמינית מנוקדת"],[.5,"שמינית"],[.25,"שש-עשרית"]];
  const POS=[[0,"פתוחה (סריגים 0 עד 4)",0,4],[2,"סריג 2 (2 עד 5)",2,5],[5,"סריג 5 (5 עד 9)",5,9],[7,"סריג 7 (7 עד 11)",7,11],[12,"סריג 12 (12 עד 16)",12,16]];
  const TS=[[2,4],[3,4],[4,4],[6,8]];
  const VIEWS=[["both","תווים וטאבים"],["staff","תווים"],["tab","טאבים"]];
  let marks=null,st=null,sel=0,hist=[],hp=-1,view="both",playT=[],playing=false,saveTimer=0;

  const positionsOf=m=>{const o=[];for(let s=1;s<=6;s++){const f=m-TUNING[s];if(f>=0&&f<=MAXF)o.push({s,f})}return o};
  /* Viterbi over playable positions: stay inside the chosen position, keep the hand still, prefer open strings in first position */
  function assignTabs(items,pref){
    const P=POS.find(p=>p[0]===pref)||POS[0],lo=P[2],hi=P[3];
    const idx=items.map((it,i)=>it.rest?-1:i).filter(i=>i>=0);
    if(!idx.length)return;
    const opts=idx.map(i=>{const it=items[i];let o=positionsOf(it.midi);if(it.lock){const l=o.find(p=>p.s===it.s&&p.f===it.f);if(l)o=[l]}return o.length?o:[{s:1,f:Math.max(0,it.midi-64)}]});
    const local=p=>{if(p.f===0)return lo===0?0:3;let c=p.f<lo?(lo-p.f)*2:p.f>hi?(p.f-hi)*2:0;return c+p.f*.03};
    const hand=p=>p.f===0?null:p.f;
    let cost=opts[0].map(local),back=[];
    for(let k=1;k<opts.length;k++){
      const prev=opts[k-1],cur=opts[k],nc=[],nb=[];
      cur.forEach(p=>{let best=Infinity,bi=0;prev.forEach((q,j)=>{
        const hp_=hand(q),hc=hand(p);let t=(hp_!=null&&hc!=null)?Math.abs(hp_-hc)*.5:0;t+=Math.abs(p.s-q.s)*.08;
        if(cost[j]+t<best){best=cost[j]+t;bi=j}});nc.push(best+local(p));nb.push(bi)});
      cost=nc;back.push(nb);
    }
    let j=cost.indexOf(Math.min(...cost));
    for(let k=opts.length-1;k>=0;k--){const it=items[idx[k]],p=opts[k][j];it.s=p.s;it.f=p.f;if(k>0)j=back[k-1][j]}
  }
  const ALLOWED=DURS.map(d=>d[0]);
  const snap=b=>ALLOWED.reduce((a,c)=>Math.abs(Math.log2(c/b))<Math.abs(Math.log2(a/b))?c:a,1);
  function fromTranscription(res){
    const items=[],ns=res.notes;
    /* the pulse is the most common distance between notes, so that most notes come out as quarters */
    const ioi=ns.slice(1).map((n,i)=>n.t0-ns[i].t0).filter(v=>v>.12).sort((a,b)=>a-b);
    let beat=res.bpm?60/res.bpm:.6;
    if(ioi.length>=3){const med=ioi[ioi.length>>1];beat=med;while(60/beat<50)beat/=2;while(60/beat>160)beat*=2}
    const bpm=Math.round(60/beat);
    for(let k=0;k<ns.length;k++){
      const n=ns[k],b=k+1<ns.length?(ns[k+1].t0-n.t0)/beat:Math.max(1,n.dur/beat);
      items.push({midi:n.midi,beats:snap(Math.min(b,4))});
      if(b>4.6)items.push({rest:true,beats:snap(Math.min(b-4,4))});
    }
    const s={v:1,bpm,ts:[4,4],pref:0,items};

  }
  function fromText(txt,bpm){
    const items=txt.split(" ").map(t=>{const[p,b]=t.split(":");return p==="R"?{rest:true,beats:+(b||1)}:{midi:N(p).m,beats:+(b||1)}});
    const s={v:1,bpm:bpm||96,ts:[4,4],pref:0,items};assignTabs(s.items,0);return s;
  }
  /* ---------- layout ---------- */
  const barLen=()=>st.ts[0]*4/st.ts[1];
  function layout(){
    const L=barLen(),out=[];let beat=0,x=170;

  function noteGlyph(it){

    }
    s+=head(n,y,hollow);
    if(dotted){const dy=n.step%2===0?y-8:y;s+=`<circle cx="32" cy="${dy}" r="4.5" fill="${ink}"/>`}
    if(n.acc){const g=GLYPH.sharp,k=.1;s+=`<path transform="translate(${-36-275*k} ${y+131*k}) scale(${k} ${-k})" d="${g.d}" fill="${ink}"/>`}

  }
  function restGlyph(it){
    const b=it.beats,dotted=[3,1.5,.75].includes(b),base=dotted?b/1.5:b;let s="";
    if(base===4)s=`<rect x="-14" y="${-6*S}" width="28" height="12" fill="${ink}"/>`;
    else if(base===2)s=`<rect x="-14" y="${-4*S-12}" width="28" height="12" fill="${ink}"/>`;
    else if(base===1)s=`<path d="M-6 -104l14 18-10 14 12 18c-10-6-18-2-12 10-14-10-8-24 4-20l-12-16 10-12z" fill="${ink}"/>`;
    else{const n=base===.5?1:2;for(let k=0;k<n;k++)s+=`<circle cx="${-6+k*-4}" cy="${-76+k*20}" r="6" fill="${ink}"/><path d="M${-6+k*-4} ${-76+k*20}q10 4 14-6l-16 ${46-k*20}" stroke="${ink}" stroke-width="3" fill="none"/>`}
    if(dotted)s+=`<circle cx="22" cy="-72" r="4.5" fill="${ink}"/>`;
    return s;
  }
  function svg(){
    const {cols,W}=layout(),notes=st.items.filter(x=>!x.rest).map(x=>noteOf(x.midi)),r=stepRange(notes.length?notes:[N("E4")]);
    const showStaff=view!=="tab",showTab=view!=="staff";
    const top=showStaff?-r.hi*S:0,staffBottom=showStaff?-r.lo*S:0,tabTop=showStaff?staffBottom+40:30,TG=20,tabBottom=tabTop+5*TG;
    const bottom=(showTab?tabBottom+40:staffBottom+30)+(marks?30:0),H=bottom-top;let g="";
    if(showStaff){g+=linesSVG(W)+clefSVG(10)+`<text x="122" y="-76" text-anchor="middle" font-size="58" font-weight="700" fill="${ink}" font-family="Georgia,serif">${st.ts[0]}</text><text x="122" y="-12" text-anchor="middle" font-size="58" font-weight="700" fill="${ink}" font-family="Georgia,serif">${st.ts[1]}</text>`}

      ["T","A","B"].forEach((c,k)=>g+=`<text x="40" y="${tabTop+20+k*30}" text-anchor="middle" font-size="26" font-weight="700" fill="${ink}" font-family="var(--body)">${c}</text>`)}

    cols.forEach(c=>{

      if(c.atBar||c.i===0){

  function globals(){

async function batchRun(ver){

  else if(b.id==="mc-rec5")micRec5();
  else if(b.id==="mc-play"&&MC.clip){audio();const bf=ctx.createBuffer(1,MC.clip.x.length,MC.clip.sr);bf.copyToChannel(MC.clip.x,0);const s=ctx.createBufferSource();s.buffer=bf;s.connect(master);s.start()}
  else if(b.id==="mc-copy"){const t=JSON.stringify({facts:MC.facts,mic:MC.log},null,1),pre=document.getElementById("mc-copied");let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(err){}b.textContent=ok?"הועתק":"להעתיק את הטקסט למטה";if(!ok){pre.textContent=t;pre.hidden=false}}
  if(!document.getElementById("dv-main"))return;
  if(b.dataset.kitrec){
    const k=KIT.find(q=>q.id===b.dataset.kitrec);DV.msg="";
    try{
      const r=await recordAudio({onTick:(s,p)=>{const t=document.getElementById("kit-time"),m=document.getElementById("kit-meter");if(t)t.textContent=fmt(s);if(m)m.style.width=Math.min(100,p*100)+"%"},
        onDone:bytes=>{DV.rec=null;kitFromBytes(k,bytes,"mic")},onError:()=>{DV.rec=null;DV.msg="ההקלטה נכשלה.";drawDev()}});
      DV.rec={kit:k.id,r};drawDev();
    }catch(err){DV.msg=micErrorText(err)+" בינתיים אפשר להקליט באפליקציית הקלטה ולהעלות את הקובץ.";drawDev()}
  }
  else if(b.id==="kit-stop"&&DV.rec)DV.rec.r.stop();
  else if(b.dataset.takewav){const t=DV.takes.find(q=>q.id===b.dataset.takewav);if(t)saveWav(t)}
  else if(b.dataset.takeopen){DV.open=DV.open===b.dataset.takeopen?null:b.dataset.takeopen;drawDev()}
  else if(b.dataset.takedel){await Store.del("takes",b.dataset.takedel).catch(()=>{});DV.takes=DV.takes.filter(t=>t.id!==b.dataset.takedel);DV.open=null;drawDev()}
  else if(b.id==="dv-run"){if(!DV.batch.audio.length){DV.msg="בחרו קודם הקלטות וקובצי תווים.";drawDev();return}batchRun(document.getElementById("dv-engine").value)}
  else if(b.id==="dv-rerun")rerunStored();
  else if(b.id==="dv-save")saveReport();
  else if(b.id==="dv-copy"){const t=reportText(),pre=document.getElementById("dv-copied");let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(err){}b.textContent=ok?"הועתק":"להעתיק את הטקסט למטה";if(!ok){pre.textContent=t;pre.hidden=false}}
  else if(b.id==="dv-clearruns"){if(b.dataset.sure){for(const r of DV.runs)await Store.del("runs",r.id).catch(()=>{});DV.runs=[];drawDev()}else{b.dataset.sure="1";b.textContent="כן, למחוק"}}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.kitfile&&t.files[0]){const k=KIT.find(q=>q.id===t.dataset.kitfile),f=t.files[0];DV.msg="";DV.busy="קוראים את הקובץ...";drawDev();f.arrayBuffer().then(b=>kitFromBytes(k,b,"file"))}
  if(t.id==="dv-files"){const fs=[...t.files];DV.batch.audio=fs.filter(f=>!/\.(txt|json|csv)$/i.test(f.name));DV.batch.truth=fs.filter(f=>/\.(txt|json|csv)$/i.test(f.name));drawDev()}
});

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.sys){DB.sys=b.dataset.sys;save();rerender();return}
  if(b.dataset.play){const n=ALLNOTES.find(x=>x.key===b.dataset.play);playNote(n);return}
  if(b.dataset.level){view={k:"level",id:+b.dataset.level};rerender();return}
  if(b.dataset.locked){document.getElementById("lockmsg").textContent=`שלב ${+b.dataset.locked+1} ייפתח אחרי שתקבלו כוכב בשלב ${b.dataset.locked}.`;return}
  if(b.dataset.go){view={k:b.dataset.go};rerender();return}
  if(b.dataset.speed){DB.speed=b.dataset.speed;save();rerender();return}
  if(b.dataset.start){startGame(b.dataset.lid,b.dataset.start);return}
  if(b.dataset.str){const s=+b.dataset.str;pluck(OPEN[s]-12);tuneTarget=s;document.querySelectorAll(".strbtn").forEach(x=>x.classList.toggle("lit",x===b));return}
  if(b.id==="quit"){save();view=view.k==="level"||view.k==="train"?view:{k:"home"};rerender();return}
  if(b.id==="reset"){
    if(b.dataset.sure){const sys=DB.sys;DB=JSON.parse(JSON.stringify(DEF));DB.sys=sys;save();applySettings();rerender();return}
    b.dataset.sure="1";b.textContent="כן, למחוק הכול";document.getElementById("resetmsg").textContent="המחיקה לא ניתנת לביטול. לחיצה נוספת תמחק את הכוכבים והסטטיסטיקה.";return}
  if(b.id==="tunemic"){tuneMic(b);return}
  if(!G)return;
  if(b.dataset.pick){answerPick(b);return}
  if(b.classList.contains("cell")){answerCell(b);return}
  if(b.id==="selfshow"){selfReveal();return}
  if(b.id==="selfyes"){right({silent:true});if(G&&G.q.length)selfAsk();return}
  if(b.id==="selfno"){G.wrongNow=1;right({silent:true});if(G&&G.q.length)selfAsk();return}
  if(b.id==="skipnote"){const n=G.q[0].n;playNote(n);G.wrongNow=Math.max(1,G.wrongNow);setBubble(`זה ${label(n)}, ${placeText(n)}. עכשיו מנגנים.`,"calm");return}
});
function answerPick(b){
  const n=G.q[0]&&G.q[0].n;if(!n)return;
  if(b.dataset.pick===n.L+n.acc)right();else{b.classList.add("no");wrong()}
}
function answerCell(b){
  const n=G.q[0]&&G.q[0].n;if(!n)return;
  const s=+b.dataset.s,f=+b.dataset.f,m=OPEN[s]+f;
  if(m===n.m){pluck(m-12);right({silent:true});b.dataset.m="✓";b.classList.add("ok");setTimeout(()=>{b.classList.remove("ok");b.dataset.m=""},320)}
  else{pluck(m-12,0,.55);b.dataset.m="✗";b.classList.add("no");wrong()}
}
addEventListener("keydown",e=>{
  if(!G)return;
  if(e.key==="Escape"){document.getElementById("quit").click();return}
  if(G.mode!=="names"||e.ctrlKey||e.metaKey||e.altKey)return;
  let b=null;
  if(/^[1-9]$/.test(e.key)){const c=G.choices[+e.key-1];if(c)b=document.querySelector(`[data-pick="${c.L+c.acc}"]`)}
  else if(/^[a-gA-G]$/.test(e.key)){const c=G.choices.filter(x=>x.L===e.key.toUpperCase()&&x.acc===0)[0];if(c)b=document.querySelector(`[data-pick="${c.L}0"]`)}
  if(b){e.preventDefault();answerPick(b)}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.opt){DB.set[t.dataset.opt]=t.checked;save();applySettings();return}
});
app.addEventListener("input",e=>{
  if(e.target.dataset.vol!==undefined){DB.set.vol=+e.target.value;save();applySettings()}
});
let tuneTarget=null;
async function tuneMic(b){
  const out=document.getElementById("tuneout"),nd=document.getElementById("needle");
  if(Mic.stream){Mic.stop();b.textContent="הקשבה דרך המיקרופון";nd.hidden=true;out.textContent="";return}
  try{
    await Mic.start(f=>{
      if(!f)return;
      const mf=69+12*Math.log2(f/440);let best=1,d=99;
      for(let s=1;s<=6;s++){const x=mf-(OPEN[s]-12);if(tuneTarget?s===tuneTarget:Math.abs(x)<Math.abs(d)){d=x;best=s}}
      const c=Math.max(-50,Math.min(50,d*100));
      nd.querySelector("i").style.left=(50+c*.9)+"%";
      const msg=Math.abs(c)<6?"מכוון!":d<0?"נמוך מדי, מהדקים מעט":"גבוה מדי, משחררים מעט";
      out.textContent=`מיתר ${best}: ${msg}`;
    });
    b.textContent="עצירת ההקשבה";nd.hidden=false;out.textContent="מנגנים מיתר אחד...";
  }catch(err){out.textContent="הדפדפן חוסם כאן את המיקרופון. אפשר לכוון לפי האוזן בעזרת הכפתורים למעלה."}
}
let view={k:"home"};
function rerender(){
  if(view.k==="home")home();
  else if(view.k==="level")levelPage(view.id);
  else if(view.k==="train")trainPage();
  else if(view.k==="dict")dictPage();
  else if(view.k==="tuner")tunerPage();
  else if(view.k==="settings")settingsPage();
  else if(view.k==="tr")trPage();
  else if(view.k==="mic")micPage();
  else if(view.k==="dev")devPage();
  else if(view.k==="lesson")Lesson.render();
}
if(/^#(mic|dev|tr)$/.test(location.hash))view={k:location.hash.slice(1)};
applySettings();rerender();
addEventListener("hashchange",()=>{if(/^#(mic|dev|tr)$/.test(location.hash)){view={k:location.hash.slice(1)};rerender()}});
</script>
